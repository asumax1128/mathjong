name: Character AI experiment (no deploy)
on:
  pull_request:
    paths:
      - 'src/engine/character-ai-prototype.js'
      - 'src/engine/character-ai.js'
      - 'tools/simulate-characters.mjs'
      - 'tools/simulate-characters-all.mjs'
      - 'tests/character-ai-prototype.test.js'
      - 'tests/character-ai.test.js'
      - 'tests/e2e/play.mjs'
      - 'src/ui/app.js'
      - '.github/workflows/character-ai-experiment.yml'
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node and syntax checks
        run: |
          node --check src/engine/character-ai-prototype.js
          node --check src/engine/character-ai.js
          node --check tools/simulate-characters.mjs
          node --check tools/simulate-characters-all.mjs
          node --check tests/character-ai-prototype.test.js
          node --check tests/character-ai.test.js
      - name: All unit tests
        run: npm test
      - name: Mathematics I baseline versus candidate (all nine)
        run: node tools/simulate-characters-all.mjs --mode math1 --groups 8 --seed 11 --length 4 | tee /tmp/all-math1.json
      - name: Mathematics II baseline versus candidate (all nine)
        run: node tools/simulate-characters-all.mjs --mode math2 --groups 8 --seed 12 --length 4 | tee /tmp/all-math2.json
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Character-specific browser regression
        run: node tests/e2e/play.mjs --only v06Characters,v04bLevels,v05eCutin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nine-character-ai-benchmark
          path: /tmp/all-math*.json
          if-no-files-found: ignore
