name: Character AI cross-level validation
on:
  pull_request:
    paths:
      - 'tools/simulate-characters-cross.mjs'
      - 'tools/sim-v06.mjs'
      - 'src/engine/character-ai.js'
      - '.github/workflows/character-ai-cross.yml'
  workflow_dispatch:
jobs:
  comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check tools/simulate-characters-cross.mjs
          node --check tools/sim-v06.mjs
      # Ver.0.6-a からの比較用（従来の小標本）
      - name: Mathematics I cross-level (legacy tool)
        run: node tools/simulate-characters-cross.mjs --mode math1 --groups 4 --seed 31 | tee /tmp/cross-math1.json
      - name: Mathematics II cross-level (legacy tool)
        run: node tools/simulate-characters-cross.mjs --mode math2 --groups 4 --seed 32 | tee /tmp/cross-math2.json
      # Ver.0.6 最終調整：並列シミュレーター（同点は順位を分け合う・95%信頼区間）。初級1 vs 中級3、中級1 vs 上級3 と、その逆
      - name: Mathematics I cross-level (sim-v06, 4 hands)
        run: |
          node tools/sim-v06.mjs --exp cross --mode math1 --groups 8 --seed 900201 --workers 4 --out /tmp/v06-cross-math1.json > /dev/null
          node tools/summarize-v06.mjs /tmp/v06-cross-math1.json | tee /tmp/v06-cross-math1.md
      - name: Mathematics II cross-level (sim-v06, 4 hands)
        run: |
          node tools/sim-v06.mjs --exp cross --mode math2 --groups 3 --seed 900202 --workers 4 --out /tmp/v06-cross-math2.json > /dev/null
          node tools/summarize-v06.mjs /tmp/v06-cross-math2.json | tee /tmp/v06-cross-math2.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nine-character-cross-level-comparison
          path: |
            /tmp/cross-math*.json
            /tmp/v06-*
