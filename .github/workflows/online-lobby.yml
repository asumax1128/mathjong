name: Online stage 1 (lobby) checks (emulator only, no deploy)
# オンライン対戦 段階1（ロビーまで・docs/79）。Auth・Database エミュレータ（demo- プロジェクト）だけを使い、本番の Firebase には接続しない。
on:
  pull_request:
    paths:
      - 'src/ui/online-*.js'
      - 'src/ui/app.js'
      - 'src/ui/styles.css'
      - 'firebase/**'
      - 'firebase.emulator.json'
      - 'scripts/prepare-mathjong-rules.cjs'
      - 'scripts/build-emulator-rules.cjs'
      - 'tests/online-*'
      - 'tests/e2e/online-lobby.mjs'
      - '.github/workflows/online-lobby.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          for f in src/ui/online-config.js src/ui/online-transport.js src/ui/online-lobby.js src/ui/online-ui.js src/ui/app.js \
                   firebase/mathjong-rules.cjs scripts/prepare-mathjong-rules.cjs scripts/build-emulator-rules.cjs \
                   tests/online-rules-emulator.mjs tests/online-lobby-emulator.mjs tests/e2e/online-lobby.mjs; do node --check "$f"; done
      - name: Unit tests (all, including the memory-bus lobby tests and the rules prepare script)
        run: npm test
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install firebase-tools (outside the repo), Firebase SDK and browser
        run: |
          npm install --prefix "$RUNNER_TEMP/firebase-cli" firebase-tools@14.27.0
          npm install --no-save --no-package-lock playwright@1.56.1 firebase@12.12.0
          npx playwright install --with-deps chromium
      - name: Build emulator rules (games/mathjong fragment only)
        run: node scripts/build-emulator-rules.cjs
      - name: Rules tests, lobby integration (SDK) and multi-context browser E2E on the emulators
        run: |
          mkdir -p "$RUNNER_TEMP/online-shots"
          "$RUNNER_TEMP/firebase-cli/node_modules/.bin/firebase" emulators:exec --only auth,database --project demo-mathjong --config firebase.emulator.json \
            "node tests/online-rules-emulator.mjs && node tests/online-lobby-emulator.mjs && node tests/e2e/online-lobby.mjs --shots $RUNNER_TEMP/online-shots"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: online-lobby-screens
          path: ${{ runner.temp }}/online-shots
          if-no-files-found: ignore
