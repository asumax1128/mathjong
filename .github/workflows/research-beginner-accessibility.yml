name: Beginner AI accessibility research (no deploy)
on:
  pull_request:
    paths:
      - tools/research-beginner-accessibility.mjs
      - .github/workflows/research-beginner-accessibility.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tools/research-beginner-accessibility.mjs
      - name: Simulate paired novice proxy vs baseline/gentle/easy AI
        run: |
          mkdir -p /tmp/beginner
          BEGINNER_MATCHES=12 node tools/research-beginner-accessibility.mjs | tee /tmp/beginner/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beginner-accessibility-results
          path: /tmp/beginner/result.json
          if-no-files-found: error
