name: Paifu foundation (Draft, no deploy)
on:
  pull_request:
    paths:
      - 'src/engine/**'
      - 'tests/paifu.test.js'
      - 'tests/e2e/paifu.mjs'
      - 'docs/51-v08-paifu-foundation-schema.md'
      - '.github/workflows/paifu-foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check src/engine/paifu.js
          node --check tests/paifu.test.js
          node --check tests/e2e/paifu.mjs
      - name: All unit tests
        run: npm test
      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Recorder in actual browser, no production hooks
        run: node tests/e2e/paifu.mjs
      - name: Existing AI, beginner room, riichi and match regression
        run: node tests/e2e/play.mjs --only v06TrioIntegration,v07BeginnerRoom2,v05Riichi,v04End
