name: Riichi fee 0 vs 5 research (no deploy)
on:
  pull_request:
    paths:
      - tools/research-riichi-fee.mjs
      - .github/workflows/research-riichi-fee.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  settlement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tools/research-riichi-fee.mjs
      - name: Same-game settlement comparison
        run: |
          mkdir -p /tmp/riichi-research
          FEE_MATCHES=16 node tools/research-riichi-fee.mjs | tee /tmp/riichi-research/results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: riichi-fee-results
          path: /tmp/riichi-research/results.json
